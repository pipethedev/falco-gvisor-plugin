#
# Detection rules for gVisor-sandboxed containers (source: gvisor).
#
# Tune without editing rules by overriding the *_allowlist macros in a later
# rules file, for example:
#
#   - macro: gvisor_metadata_allowlist
#     condition: (container.image startswith "registry.example.com/billing/")
#     override:
#       condition: replace
#
# Rules marked "full profile" need syscall/openat in the trace session
# (deploy/pod-init-full.json); the lean default session does not trace opens.

- required_engine_version: 0.65.0

- required_plugin_versions:
    - name: gvisor
      version: 0.1.0

# ---------------------------------------------------------------------------
# Shared macros and lists
# ---------------------------------------------------------------------------

- macro: gvisor_never_true
  condition: (evt.type = "gvisor_never_true")

- macro: gvisor_exec
  condition: (evt.type = sentry_execve)

- macro: gvisor_connect
  condition: (evt.type = connect and fd.type in (ipv4, ipv6))

- macro: gvisor_open
  condition: (evt.type in (open, openat, openat2, creat))

- macro: gvisor_open_read
  condition: (gvisor_open and evt.is_open_read = true)

- macro: gvisor_open_write
  condition: (gvisor_open and evt.is_open_write = true)

- list: gvisor_shell_binaries
  items: [sh, bash, dash, ash, zsh, ksh, mksh, csh, tcsh, fish, busybox]

- macro: gvisor_shell_procs
  condition: (proc.name in (gvisor_shell_binaries))

- list: gvisor_download_binaries
  items: [curl, wget, fetch, aria2c, busybox]

# ---------------------------------------------------------------------------
# 1. Crypto mining
# ---------------------------------------------------------------------------

- list: gvisor_miner_binaries
  items: [xmrig, xmr-stak, xmr-stak-cpu, minerd, cpuminer, cpuminer-multi, ccminer,
          lolminer, nbminer, t-rex, gminer, nanominer, srbminer, srbminer-multi,
          teamredminer, kinsing, kdevtmpfsi]

- list: gvisor_stratum_ports
  items: [3333, 3334, 4444, 5555, 14433, 14444, 45700]

- macro: gvisor_miner_cmdline
  condition: >
    (proc.args contains "stratum+tcp://" or
     proc.args contains "stratum+ssl://" or
     proc.args contains "stratum2+tcp://" or
     proc.args contains "-a rx/" or
     proc.args contains "--algo " or
     proc.args contains "--algo=" or
     proc.args contains "--donate-level")

# Generated by rules/tools/pool_ips.sh; see docs/runbook.md for refresh guidance.
- macro: gvisor_miner_pool_ip
  condition: (gvisor_never_true)

- macro: gvisor_mining_allowlist
  condition: (gvisor_never_true)

- rule: gVisor Crypto Miner Executed
  desc: A known cryptocurrency miner binary was executed inside a gVisor sandbox.
  condition: >
    gvisor_exec and proc.name in (gvisor_miner_binaries)
    and not gvisor_mining_allowlist
  output: >
    Crypto miner executed in gVisor sandbox (proc=%proc.name exepath=%proc.exepath
    cmdline=%proc.cmdline parent=%proc.pname uid=%user.uid upper_layer=%proc.is_exe_upper_layer
    sha256=%proc.sha256 container=%container.name image=%container.image id=%container.id
    k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
  priority: CRITICAL
  source: gvisor
  tags: [gvisor, container, mitre_impact, T1496]

- rule: gVisor Crypto Miner Arguments
  desc: A process was started with arguments typical of cryptocurrency miners (stratum URLs, mining algorithms, donate level).
  condition: >
    gvisor_exec and gvisor_miner_cmdline
    and not proc.name in (gvisor_miner_binaries)
    and not gvisor_mining_allowlist
  output: >
    Process with crypto-miner arguments in gVisor sandbox (proc=%proc.name exepath=%proc.exepath
    cmdline=%proc.cmdline parent=%proc.pname uid=%user.uid container=%container.name
    image=%container.image id=%container.id k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
  priority: CRITICAL
  source: gvisor
  tags: [gvisor, container, mitre_impact, T1496]

- rule: gVisor Connection to Mining Pool Port
  desc: Outbound connection to a port commonly used by stratum mining pools.
  condition: >
    gvisor_connect and fd.rport in (gvisor_stratum_ports)
    and not gvisor_mining_allowlist
  output: >
    Connection to mining pool port from gVisor sandbox (connection=%fd.name proc=%proc.name
    cmdline=%proc.cmdline parent=%proc.pname container=%container.name image=%container.image
    id=%container.id k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
  priority: WARNING
  source: gvisor
  tags: [gvisor, container, network, mitre_impact, T1496]

- rule: gVisor Connection to Known Mining Pool
  desc: Outbound connection to an IP address resolved from a known mining pool domain.
  condition: >
    gvisor_connect and gvisor_miner_pool_ip
    and not gvisor_mining_allowlist
  output: >
    Connection to known mining pool from gVisor sandbox (connection=%fd.name proc=%proc.name
    cmdline=%proc.cmdline container=%container.name image=%container.image id=%container.id
    k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
  priority: CRITICAL
  source: gvisor
  tags: [gvisor, container, network, mitre_impact, T1496]

# ---------------------------------------------------------------------------
# 2. Network abuse
# ---------------------------------------------------------------------------

- list: gvisor_network_tool_binaries
  items: [nmap, masscan, zmap, hping, hping2, hping3, nping, zgrab, zgrab2]

- macro: gvisor_network_tool_allowlist
  condition: (gvisor_never_true)

- rule: gVisor Network Scanner Executed
  desc: A network scanning or packet flooding tool was executed inside a gVisor sandbox.
  condition: >
    gvisor_exec and proc.name in (gvisor_network_tool_binaries)
    and not gvisor_network_tool_allowlist
  output: >
    Network scanner executed in gVisor sandbox (proc=%proc.name cmdline=%proc.cmdline
    parent=%proc.pname uid=%user.uid container=%container.name image=%container.image
    id=%container.id k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
  priority: WARNING
  source: gvisor
  tags: [gvisor, container, network, mitre_discovery, T1046]

- macro: gvisor_raw_socket_allowlist
  condition: (proc.name in (ping, ping6, traceroute, traceroute6, arping))

- rule: gVisor Raw Socket Created
  desc: >
    A raw IP or packet socket was created, which allows crafting arbitrary packets (scanning,
    spoofing, flooding). Netlink sockets also use SOCK_RAW but are routine (glibc getaddrinfo,
    Go net.Interfaces, iproute2) and are not matched.
  condition: >
    evt.type = socket and evt.failed = false
    and (evt.arg.domain = AF_PACKET
         or (evt.arg.type in (SOCK_RAW, SOCK_PACKET) and evt.arg.domain in (AF_INET, AF_INET6)))
    and not gvisor_raw_socket_allowlist
  output: >
    Raw socket created in gVisor sandbox (domain=%evt.arg.domain type=%evt.arg.type proc=%proc.name
    cmdline=%proc.cmdline parent=%proc.pname uid=%user.uid container=%container.name
    image=%container.image id=%container.id k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
  priority: WARNING
  source: gvisor
  tags: [gvisor, container, network, mitre_discovery, T1040]

- list: gvisor_smtp_ports
  items: [25, 465, 587, 2525]

- macro: gvisor_mail_server_workloads
  condition: (proc.name in (postfix, master, smtp, smtpd, sendmail, exim, exim4, opensmtpd, haraka, mailhog, postal))

- rule: gVisor Outbound SMTP From Non-Mail Workload
  desc: A workload that is not a mail server connected to an SMTP port, a common sign of spam relaying or exfiltration.
  condition: >
    gvisor_connect and fd.rport in (gvisor_smtp_ports)
    and not gvisor_mail_server_workloads
  output: >
    Outbound SMTP from gVisor sandbox (connection=%fd.name proc=%proc.name cmdline=%proc.cmdline
    container=%container.name image=%container.image id=%container.id k8s_ns=%k8s.ns.name
    k8s_pod=%k8s.pod.name)
  priority: NOTICE
  source: gvisor
  tags: [gvisor, container, network, mitre_exfiltration, T1048]

# ---------------------------------------------------------------------------
# 3. Sandbox escape and host probing
#    The sandbox's own /proc/1 and /etc/shadow are not host files inside
#    gVisor, so they are deliberately not alerted on.
# ---------------------------------------------------------------------------

- macro: gvisor_runtime_socket
  condition: >
    (fd.name endswith "/docker.sock" or fd.name endswith "/containerd.sock" or
     fd.name endswith "/crio.sock" or fd.name endswith "/podman.sock" or
     fd.name endswith "/dockershim.sock")

- macro: gvisor_runtime_socket_allowlist
  condition: (gvisor_never_true)

- rule: gVisor Container Runtime Socket Access
  desc: >
    A process connected to or opened a container runtime socket. Inside a sandbox this
    only succeeds if the socket was mounted in, which gives control of the host.
    Opens need the full profile; connects are always traced.
  condition: >
    ((evt.type = connect and fd.type = unix) or gvisor_open) and gvisor_runtime_socket
    and not gvisor_runtime_socket_allowlist
  output: >
    Container runtime socket accessed from gVisor sandbox (socket=%fd.name event=%evt.type
    res=%evt.res proc=%proc.name cmdline=%proc.cmdline parent=%proc.pname container=%container.name
    image=%container.image id=%container.id k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
  priority: CRITICAL
  source: gvisor
  tags: [gvisor, container, mitre_privilege_escalation, T1611]

- macro: gvisor_host_probe_allowlist
  condition: (gvisor_never_true)

- rule: gVisor Host Kernel Interface Tampering
  desc: >
    Access to /proc/sysrq-trigger or a write under /sys/kernel, both used to probe or
    tamper with the host kernel. Requires the full profile.
  condition: >
    gvisor_open and (fd.name = /proc/sysrq-trigger
                     or (evt.is_open_write = true and fd.name startswith /sys/kernel/))
    and not gvisor_host_probe_allowlist
  output: >
    Host kernel interface accessed from gVisor sandbox (file=%fd.name flags=%evt.arg.flags
    proc=%proc.name cmdline=%proc.cmdline parent=%proc.pname container=%container.name
    image=%container.image id=%container.id k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
  priority: CRITICAL
  source: gvisor
  tags: [gvisor, container, mitre_privilege_escalation, T1611]

- macro: gvisor_ptrace_allowlist
  condition: (gvisor_never_true)

- rule: gVisor Ptrace Attach
  desc: A process attached to or wrote into another process with ptrace (injection, credential theft, escape attempts).
  condition: >
    evt.type = ptrace
    and evt.arg.request in (PTRACE_ATTACH, PTRACE_SEIZE, PTRACE_POKETEXT, PTRACE_POKEDATA)
    and not gvisor_ptrace_allowlist
  output: >
    Ptrace attach in gVisor sandbox (request=%evt.arg.request res=%evt.res proc=%proc.name
    cmdline=%proc.cmdline parent=%proc.pname uid=%user.uid container=%container.name
    image=%container.image id=%container.id k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
  priority: WARNING
  source: gvisor
  tags: [gvisor, container, mitre_privilege_escalation, T1055.008]

- list: gvisor_namespace_tool_binaries
  items: [mount, nsenter, unshare]

- macro: gvisor_namespace_tool_allowlist
  condition: (gvisor_never_true)

- rule: gVisor Namespace or Mount Tool Executed
  desc: mount, nsenter or unshare was executed inside a sandbox, typical of container escape attempts.
  condition: >
    gvisor_exec and proc.name in (gvisor_namespace_tool_binaries)
    and not gvisor_namespace_tool_allowlist
  output: >
    Namespace or mount tool executed in gVisor sandbox (proc=%proc.name cmdline=%proc.cmdline
    parent=%proc.pname uid=%user.uid container=%container.name image=%container.image
    id=%container.id k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
  priority: WARNING
  source: gvisor
  tags: [gvisor, container, mitre_privilege_escalation, T1611]

# ---------------------------------------------------------------------------
# 4. Drop and execute
# ---------------------------------------------------------------------------

# gVisor flags a binary as upper-layer only on its rootfs overlay; /dev/shm is a
# tmpfs where the flag is always false, so executing from it is matched directly.
- macro: gvisor_tmp_upper_exec
  condition: >
    (proc.is_exe_upper_layer = true
     and (proc.exepath startswith /tmp/ or proc.exepath startswith /var/tmp/))

- macro: gvisor_shm_exec
  condition: (proc.exepath startswith /dev/shm/)

- macro: gvisor_drop_exec_allowlist
  condition: (gvisor_never_true)

- rule: gVisor Dropped Binary Executed From Temp Directory
  desc: >
    A binary written at runtime was executed from /tmp or /var/tmp (container upper layer),
    or any binary was executed from /dev/shm.
  condition: >
    gvisor_exec and (gvisor_tmp_upper_exec or gvisor_shm_exec)
    and not gvisor_drop_exec_allowlist
  output: >
    Dropped binary executed from temp directory in gVisor sandbox (exepath=%proc.exepath
    cmdline=%proc.cmdline parent=%proc.pname sha256=%proc.sha256 uid=%user.uid
    container=%container.name image=%container.image id=%container.id k8s_ns=%k8s.ns.name
    k8s_pod=%k8s.pod.name)
  priority: CRITICAL
  source: gvisor
  tags: [gvisor, container, mitre_execution, T1105, T1059]

- macro: gvisor_memfd_allowlist
  condition: (gvisor_never_true)

- rule: gVisor Fileless Execution From Memfd
  desc: A program was executed from an anonymous memory file (memfd), a fileless malware technique.
  condition: >
    gvisor_exec and proc.is_exe_from_memfd = true
    and not gvisor_memfd_allowlist
  output: >
    Fileless execution from memfd in gVisor sandbox (exepath=%proc.exepath cmdline=%proc.cmdline
    parent=%proc.pname uid=%user.uid container=%container.name image=%container.image
    id=%container.id k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
  priority: CRITICAL
  source: gvisor
  tags: [gvisor, container, mitre_defense_evasion, T1620]

- macro: gvisor_download_pipe_allowlist
  condition: (gvisor_never_true)

- rule: gVisor Download Piped to Shell
  desc: A shell was started reading a script directly from a downloader (curl | sh, wget -O- | bash).
  condition: >
    gvisor_exec and gvisor_shell_procs
    and (gvisor.stdin_pipe_proc in (gvisor_download_binaries)
         or ((proc.args contains "curl " or proc.args contains "wget ")
             and (proc.args contains "| sh" or proc.args contains "|sh" or
                  proc.args contains "| bash" or proc.args contains "|bash")))
    and not gvisor_download_pipe_allowlist
  output: >
    Download piped to shell in gVisor sandbox (shell=%proc.name cmdline=%proc.cmdline
    stdin_from=%gvisor.stdin_pipe_proc parent=%proc.pname uid=%user.uid container=%container.name
    image=%container.image id=%container.id k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
  priority: WARNING
  source: gvisor
  tags: [gvisor, container, mitre_execution, T1059.004, T1105]

# ---------------------------------------------------------------------------
# 5. Reverse shells and persistence
# ---------------------------------------------------------------------------

- macro: gvisor_reverse_shell_allowlist
  condition: (gvisor_never_true)

- rule: gVisor Shell With Network Socket Stdio
  desc: A shell was started with stdin or stdout attached to a network socket, the signature of a reverse or bind shell.
  condition: >
    gvisor_exec and gvisor_shell_procs
    and (proc.stdin.type in (ipv4, ipv6) or proc.stdout.type in (ipv4, ipv6))
    and not gvisor_reverse_shell_allowlist
  output: >
    Shell with network socket stdio in gVisor sandbox (shell=%proc.name cmdline=%proc.cmdline
    stdin=%proc.stdin.type stdout=%proc.stdout.type parent=%proc.pname uid=%user.uid
    container=%container.name image=%container.image id=%container.id k8s_ns=%k8s.ns.name
    k8s_pod=%k8s.pod.name)
  priority: CRITICAL
  source: gvisor
  tags: [gvisor, container, mitre_execution, T1059.004]

- list: gvisor_netcat_binaries
  items: [nc, ncat, netcat, nc.traditional, nc.openbsd, socat]

- rule: gVisor Reverse Shell Command Line
  desc: A command line contains a well-known reverse shell construct (/dev/tcp, nc -e, interactive shell redirected to a socket).
  condition: >
    gvisor_exec
    and (proc.args contains "/dev/tcp/" or proc.args contains "/dev/udp/"
         or (proc.name in (gvisor_netcat_binaries)
             and (proc.args contains "-e " or proc.args contains "-c " or proc.args contains "exec:"))
         or proc.args contains "-i >&" or proc.args contains "-i >& ")
    and not gvisor_reverse_shell_allowlist
  output: >
    Reverse shell command line in gVisor sandbox (proc=%proc.name cmdline=%proc.cmdline
    parent=%proc.pname uid=%user.uid container=%container.name image=%container.image
    id=%container.id k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
  priority: CRITICAL
  source: gvisor
  tags: [gvisor, container, mitre_execution, T1059.004]

- macro: gvisor_persistence_allowlist
  condition: (gvisor_never_true)

- rule: gVisor Write to Cron or SSH Authorized Keys
  desc: A file used for persistence (cron tables, SSH authorized_keys) was opened for writing. Requires the full profile.
  condition: >
    gvisor_open_write
    and (fd.name startswith /etc/cron or fd.name startswith /var/spool/cron
         or fd.filename in (authorized_keys, authorized_keys2))
    and not gvisor_persistence_allowlist
  output: >
    Persistence file written in gVisor sandbox (file=%fd.name flags=%evt.arg.flags proc=%proc.name
    cmdline=%proc.cmdline parent=%proc.pname uid=%user.uid container=%container.name
    image=%container.image id=%container.id k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
  priority: WARNING
  source: gvisor
  tags: [gvisor, container, mitre_persistence, T1053.003, T1098.004]

# ---------------------------------------------------------------------------
# 6. Credential access
# ---------------------------------------------------------------------------

- macro: gvisor_metadata_allowlist
  condition: (gvisor_never_true)

- rule: gVisor Connection to Cloud Metadata Service
  desc: A process connected to a cloud instance metadata endpoint, which can expose node or workload credentials.
  condition: >
    gvisor_connect
    and fd.rip in ("169.254.169.254", "169.254.170.2", "fd00:ec2::254")
    and not gvisor_metadata_allowlist
  output: >
    Cloud metadata service contacted from gVisor sandbox (connection=%fd.name proc=%proc.name
    cmdline=%proc.cmdline parent=%proc.pname container=%container.name image=%container.image
    id=%container.id k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
  priority: WARNING
  source: gvisor
  tags: [gvisor, container, network, mitre_credential_access, T1552.005]

- macro: gvisor_sa_token_allowlist
  condition: (gvisor_never_true)

- rule: gVisor Service Account Token Read
  desc: >
    A Kubernetes or cloud workload identity token was read. Expected for API clients;
    allowlist them via gvisor_sa_token_allowlist. Requires the full profile.
  condition: >
    gvisor_open_read and fd.filename = token
    and (fd.name startswith /var/run/secrets/ or fd.name startswith /run/secrets/)
    and not gvisor_sa_token_allowlist
  output: >
    Service account token read in gVisor sandbox (file=%fd.name proc=%proc.name cmdline=%proc.cmdline
    parent=%proc.pname container=%container.name image=%container.image id=%container.id
    k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
  priority: NOTICE
  source: gvisor
  tags: [gvisor, container, mitre_credential_access, T1528]

# ---------------------------------------------------------------------------
# Plugin health (disabled by default)
# ---------------------------------------------------------------------------

- rule: gVisor Monitoring Dropping Events
  desc: The gvisor plugin reported dropped trace points. Enable to surface monitoring gaps as alerts.
  condition: evt.type = gvisor_stats and gvisor.stats.drops > 0
  output: >
    gVisor monitoring is dropping events (drops=%gvisor.stats.drops channel_full=%gvisor.stats.drops_channel_full
    sandbox=%gvisor.stats.drops_sandbox truncated=%gvisor.stats.drops_truncated
    connections=%gvisor.stats.connections attach_failures=%gvisor.stats.attach_failures)
  priority: INFORMATIONAL
  source: gvisor
  enabled: false
  tags: [gvisor, plugin_health]
