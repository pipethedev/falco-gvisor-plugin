name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            asset_arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            asset_arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build libgvisor.so
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p out
          CGO_ENABLED=1 go build -trimpath -buildmode=c-shared \
            -ldflags "-s -w -X github.com/falcosecurity/plugins/plugins/gvisor/pkg/gvisor.PluginVersion=${VERSION}" \
            -o out/libgvisor.so ./cmd/plugin
          tar -czf "gvisor-${VERSION}-linux-${{ matrix.asset_arch }}.tar.gz" -C out libgvisor.so
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.arch }}
          path: gvisor-*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
      - name: Rules tarball
        run: make rules-tarball VERSION="${GITHUB_REF_NAME#v}" && mv dist/gvisor-rules-*.tar.gz .
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/falco-gvisor:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/falco-gvisor:latest
      - name: Install falcoctl
        env:
          FALCOCTL_VERSION: 0.14.2
          FALCOCTL_SHA256: 9e0c12abdee6f042cffaf33b8bc4103e70f68a597f4d02310e2aa06a860310df
        run: |
          curl -fsSLo falcoctl.tgz "https://github.com/falcosecurity/falcoctl/releases/download/v${FALCOCTL_VERSION}/falcoctl_${FALCOCTL_VERSION}_linux_amd64.tar.gz"
          echo "${FALCOCTL_SHA256}  falcoctl.tgz" | sha256sum -c -
          tar -xzf falcoctl.tgz falcoctl
          sudo install falcoctl /usr/local/bin/falcoctl
      - name: Push plugin and rules OCI artifacts
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCI_REPO: ghcr.io/${{ github.repository_owner }}/plugins
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CONFIG="${RUNNER_TEMP}/falcoctl.yaml"
          touch "${CONFIG}"
          echo "${REGISTRY_TOKEN}" | falcoctl --config "${CONFIG}" registry auth basic -u "${REGISTRY_USER}" --password-stdin ghcr.io
          falcoctl --config "${CONFIG}" registry push --type plugin --version "${VERSION}" --add-floating-tags \
            --requires plugin_api_version:3.11.0 "${OCI_REPO}/plugin/gvisor:${VERSION}" \
            "gvisor-${VERSION}-linux-x86_64.tar.gz" --platform linux/amd64 \
            "gvisor-${VERSION}-linux-aarch64.tar.gz" --platform linux/arm64
          falcoctl --config "${CONFIG}" registry push --type rulesfile --version "${VERSION}" --add-floating-tags \
            --depends-on "gvisor:${VERSION}" "${OCI_REPO}/ruleset/gvisor-rules:${VERSION}" "gvisor-rules-${VERSION}.tar.gz"
      - name: GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            gvisor-*.tar.gz
          generate_release_notes: true
