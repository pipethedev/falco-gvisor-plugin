name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build libgvisor.so
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p out
          CGO_ENABLED=1 go build -trimpath -buildmode=c-shared \
            -ldflags "-s -w -X github.com/falcosecurity/plugins/plugins/gvisor/pkg/gvisor.PluginVersion=${VERSION}" \
            -o out/libgvisor.so ./cmd/plugin
          tar -czf "gvisor-${VERSION}-linux-${{ matrix.arch }}.tar.gz" -C out libgvisor.so
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: gvisor-*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - name: Rules tarball
        run: make rules-tarball VERSION="${GITHUB_REF_NAME#v}" && mv dist/gvisor-rules-*.tar.gz .
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/falco-gvisor:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/falco-gvisor:latest
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gvisor-*.tar.gz
          generate_release_notes: true
